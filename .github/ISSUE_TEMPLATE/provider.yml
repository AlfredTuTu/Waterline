name: Provider adapter
description: Add or repair one provider under Sources/WaterlineKit/Providers/<Name>/.
labels: ["agent:codex", "type:feature"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Value of `Provider` in Model/Provider.swift, e.g. `deepseek`.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Quota kind
      options: [window, balance, both, unsupported, "capability investigation"]
    validations:
      required: true
  - type: textarea
    id: credentials
    attributes:
      label: Credential locations
      description: Tier 1 files/Keychain items and Tier 2 env names in fallback order. See docs/providers/<name>.md.
    validations:
      required: true
  - type: textarea
    id: endpoints
    attributes:
      label: Endpoint candidates
      description: URL, method, headers, and where the candidate came from. Mark each official or community.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      value: |
        - Discovery uses synthetic files/Keychain, preserves stable account identity and never prompts in the background
        - Required-field failures report schemaChanged; extra fields, optional omissions and independent valid components follow the documented contract
        - HTTPS, exact allowed hosts, account region and redirects obey AGENTS.md
        - Fixtures include provenance and are manually reviewed for private data; the audit script also passes
        - An authorised live check verifies the declared supported scope; missing access or unsupported metrics are recorded as gaps
        - Provider contract records source links, mapping, supported scope and actual verification date; no live date for fixture-only work
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      value: |
        make verify
        DEVELOPER_DIR=/Applications/Xcode.app xcrun swift test --filter <Name>
